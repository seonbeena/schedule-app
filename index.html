<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="오늘의 시간부터 한 달의 흐름까지 가볍게 정리하는 일정표입니다." />
  <link rel="manifest" href="manifest.json?v=mobile-clean-v5" />
  <link rel="apple-touch-icon" href="icon-192.png?v=mobile-clean-v5" />
  <link rel="stylesheet" href="style.css?v=mobile-clean-v5" />
  <title>데이플랜 Mobile Clean v5</title>
</head>
<body>
  <div class="phone">
    <header>
      <div class="app-title-row">
        <div>
          <h1>데이플랜 Mobile Clean v5</h1>
          <p>오늘의 시간부터 한 달의 흐름까지 가볍게 정리하세요. · Mobile Clean v5</p>
        </div>
        <button id="settingsBtn" class="settings-btn" type="button" aria-label="설정">⚙</button>
      </div>
    </header>

    <main class="container">
      <section class="schedule-wrap">
        <div class="schedule-header">
          <div class="schedule-title-row">
            <h2 id="dateTitle">일간 일정</h2>
            <button id="todayBtn" class="today-mini is-hidden" type="button">오늘 날짜</button>
          </div>
          <div class="date-nav-wrap">
            <div class="date-nav">
              <button id="prevDateBtn" class="date-arrow" type="button" aria-label="이전">‹</button>
              <div class="date-display">
                <span id="datePickerLabel"></span>
                <input id="datePicker" type="date" aria-label="날짜 선택" />
              </div>
              <button id="nextDateBtn" class="date-arrow" type="button" aria-label="다음">›</button>
            </div>
          </div>
        </div>

        <div class="schedule-subheader">
          <div class="segmented-control">
            <button id="dayViewBtn" class="active" type="button">일간</button>
            <button id="weekViewBtn" type="button">주간</button>
            <button id="monthViewBtn" type="button">월간</button>
          </div>

          <div class="filter-area">
            <label for="typeFilter">필터</label>
            <select id="typeFilter"></select>
            <span id="eventCount">0개 일정</span>
          </div>
        </div>

        <section id="summaryCard" class="summary-card">
          <button id="summaryToggle" class="summary-toggle" type="button">
            <span class="summary-title">오늘 요약</span>
            <span id="summaryCount" class="summary-count">0개</span>
            <span id="summaryPreview" class="summary-preview">일정 없음</span>
          </button>
          <div id="summaryDetail" class="summary-detail"></div>
        </section>

        <div id="schedule" class="schedule-scroll day-grid"></div>
      </section>
    </main>

    <button id="floatingAddBtn" class="floating-add-btn" type="button">+ 일정 추가</button>
  </div>

  <div id="settingsModal" class="modal" aria-hidden="true">
    <div id="settingsBackdrop" class="modal-backdrop"></div>
    <section class="event-sheet settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-header">
        <h2 id="settingsTitle">설정</h2>
        <button id="settingsCloseBtn" class="icon-btn" type="button" aria-label="닫기">×</button>
      </div>

      <div class="settings-list">
        <section class="settings-section" data-section="category">
          <button class="section-toggle" type="button" data-toggle="category">
            <span>일정 종류 관리</span>
            <span class="toggle-icon">+</span>
          </button>
          <div class="section-content">
            <label for="newCategoryName">새 종류 이름</label>
            <div class="category-input-row">
              <input id="newCategoryName" type="text" autocomplete="off" />
              <input id="newCategoryColor" type="color" value="#93c5fd" aria-label="색상 선택" />
            </div>
            <button id="addCategoryBtn" class="primary-btn" type="button">종류 추가</button>
            <div id="categoryList" class="list-area">
              <p class="empty-text">아직 추가된 일정 종류가 없습니다.</p>
            </div>
          </div>
        </section>

        <section class="settings-section" data-section="search">
          <button class="section-toggle" type="button" data-toggle="search">
            <span>일정 검색</span>
            <span class="toggle-icon">+</span>
          </button>
          <div class="section-content">
            <label for="searchInput">검색어</label>
            <input id="searchInput" type="text" autocomplete="off" />
            <div id="searchResults" class="list-area">
              <p class="empty-text">검색어를 입력하면 저장된 전체 일정에서 찾아줍니다.</p>
            </div>
          </div>
        </section>
      </div>
    </section>
  </div>

  <div id="eventModal" class="modal" aria-hidden="true">
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <section class="event-sheet" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-header">
        <h2 id="eventModalTitle">일정 추가</h2>
        <button id="closeEventModalBtn" class="icon-btn" type="button" aria-label="닫기">×</button>
      </div>

      <label for="eventDate">날짜</label>
      <div class="modal-date-field">
        <span id="eventDateLabel"></span>
        <input id="eventDate" type="date" />
      </div>

      <label for="title">일정 이름</label>
      <input id="title" type="text" autocomplete="off" />

      <label for="categorySelect">일정 종류</label>
      <select id="categorySelect"></select>

      <label for="memo">메모</label>
      <input id="memo" type="text" autocomplete="off" />

      <label class="unscheduled-row" for="isUnscheduled">
        <input id="isUnscheduled" type="checkbox" />
        <span>시간 미정</span>
      </label>

      <div id="timeFields" class="time-form-grid">
        <div>
          <label for="start">시작 시간</label>
          <select id="start"></select>
        </div>
        <div>
          <label for="end">종료 시간</label>
          <select id="end"></select>
        </div>
      </div>

      <label for="repeat">반복</label>
      <select id="repeat">
        <option value="none">반복 없음</option>
        <option value="daily">매일</option>
        <option value="weekly">매주 같은 요일</option>
        <option value="weekdays">평일</option>
      </select>

      <div id="eventButtonRow" class="button-row">
        <button id="saveEventBtn" class="primary-btn" type="button">추가하기</button>
        <button id="cancelEditBtn" class="secondary-btn" type="button">수정 취소</button>
      </div>

      <button id="deleteEditingBtn" class="danger-soft-btn" type="button">이 일정 삭제</button>
      <p class="hint">반복 일정은 화면에 자동 표시됩니다. 반복 일정 수정·삭제는 전체 반복 일정에 적용됩니다.</p>
    </section>
  </div>

  <script src="app.js?v=mobile-clean-v5"></script>
</body>
</html>
